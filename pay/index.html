<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>UPI Payment</title>
<meta name="description" content="Pay securely using any UPI app." />
<link rel="canonical" href="https://www.baatbanao.shop/pay" />
<meta name="robots" content="noindex, follow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#FFF9E8" />
<meta property="og:title" content="UPI Payment" />
<meta property="og:description" content="Pay securely using any UPI app." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://www.baatbanao.shop/pay" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="UPI Payment" />
<meta name="twitter:description" content="Pay securely using any UPI app." />
<style>
:root{--bg:#FFF9E8;--card:#FFFDF8;--text:#261818;--muted:#75615C;--border:#F0DFCF;--green:#25D366;--warn:#9A6810;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#FFF9E8,#FFF1D6);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(390px,100%);background:var(--card);border:1px solid var(--border);border-radius:28px;box-shadow:0 20px 50px rgba(90,48,30,.16);padding:20px;text-align:center}.brand{font-weight:900;font-size:22px;margin-bottom:4px}.sub{color:var(--muted);font-weight:700;font-size:13px;margin-bottom:16px}.qr{width:280px;max-width:100%;border-radius:20px;background:#fff;padding:10px;border:1px solid var(--border);display:inline-block;min-height:120px}.qr svg{display:block;width:100%;height:auto}.name{font-size:18px;font-weight:900;margin-top:14px}.upi{font-weight:900;color:var(--text);margin-top:4px;word-break:break-all}.amount{font-weight:900;color:var(--warn);margin-top:6px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:none;border-radius:18px;padding:14px 12px;font-weight:900;font-size:15px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.primary{background:var(--green);color:#fff}.secondary{background:#FFF5DF;color:var(--text);border:1px solid var(--border)}.hint{background:#FFF0C7;border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:16px;text-align:left;color:var(--warn);font-weight:700;font-size:12.5px;line-height:1.45}.bad{color:#B23A2C;font-weight:900;padding:30px 10px}.small{font-size:12px;color:var(--muted);font-weight:700;margin-top:12px}@media(max-width:360px){.btns{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body>
<div class="card" id="app">
  <div class="brand">UPI Payment</div>
  <div class="sub">Pay securely using any UPI app.</div>
  <div class="bad">Loading payment...</div>
  <noscript>JavaScript is needed to display this payment link. Check the payee and amount before paying.</noscript>
</div>
<script src="/vendor/qrcode.js"></script>
<script defer src="/pay.js"></script>
</body>
</html>
