# .github/workflows/build-vault.yml
# Builds BaatBanao Vault (APK per ABI + web bundle) on GitHub's runners on every push to vault/app.
# On a tag like vault-v0.3 it also attaches the APKs and a zipped web build to the GitHub Release,
# then publishes the web build to www.baatbanao.shop/app/ by committing it to main (folder app/).
name: Build Vault (APK + Web)

on:
  push:
    branches: [feat/vault, main]
    tags: ['vault-v*']
    paths: ['vault/app/**', '.github/workflows/build-vault.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Use a normal Gradle heap on CI (repo defaults are tuned for a 2 GB machine)
        run: |
          sed -i 's/-Xmx560m/-Xmx3g/; s/org.gradle.daemon=false/org.gradle.daemon=true/; s/org.gradle.workers.max=1/org.gradle.workers.max=4/' android/gradle.properties

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Build APKs (arm64, armv7, x86_64)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Add web platform files (project was created for Android only)
        run: |
          flutter create . --platforms web --project-name paanikhata_icecubes --org shop.baatbanao
          sed -i 's#<title>.*</title>#<title>BaatBanao Vault</title>#; s#content="A new Flutter project."#content="BaatBanao Vault — every rupee, in its place."#' web/index.html
          sed -i 's#"name": ".*"#"name": "BaatBanao Vault"#; s#"short_name": ".*"#"short_name": "Vault"#; s#"description": ".*"#"description": "BaatBanao Vault — visual multi-account balances."#' web/manifest.json
          # app shell is not a content page: keep it out of the search index; fix the iOS title
          sed -i 's#<meta charset="UTF-8">#<meta charset="UTF-8">\n  <meta name="robots" content="noindex">#; s#content="paanikhata_icecubes"#content="BaatBanao Vault"#' web/index.html

      - name: Build web bundle (served from www.baatbanao.shop/app/)
        run: |
          flutter build web --release --base-href /app/
          cd build && zip -qr vault-web.zip web

      - uses: actions/upload-artifact@v4
        with:
          name: vault-apks
          path: vault/app/build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vault-web
          path: vault/app/build/vault-web.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/vault-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            vault/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            vault/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            vault/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            vault/app/build/vault-web.zip

      - name: Publish web build to main → www.baatbanao.shop/app/ (tags only)
        if: startsWith(github.ref, 'refs/tags/vault-v')
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin main
          git worktree add -B deploy-site ../site origin/main
          rm -rf ../site/app && mkdir -p ../site/app
          cp -r vault/app/build/web/. ../site/app/
          # CanvasKit is loaded from Google's CDN (Flutter default); the local copy and symbol maps are not needed on the site
          rm -rf ../site/app/canvaskit && find ../site/app -name '*.symbols' -delete
          cd ../site
          git add -A app
          if git diff --cached --quiet; then echo "web build unchanged"; exit 0; fi
          git commit -q -m "chore(app): publish Vault web ${GITHUB_REF_NAME} to /app/"
          for i in 1 2 3; do
            if git push origin deploy-site:main; then break; fi
            git fetch origin main && git rebase origin/main
          done
