  # speech_to_text: ^7.0.0        # "box 6 me 300 aaya" voice entry
  # flame_forge2d: ^0.18.0        # agar real rigid-body (rotated square) collisions chahiye

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
